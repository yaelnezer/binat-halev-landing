<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מי מנהל את הסרט שלי? | בינת הלב - Life Coding</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700&family=Heebo:wght@300;400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2d7a6e; --primary-dark:#1f5f55; --primary-light:#4a9e90;
  --accent:#5c3a1e; --accent-mid:#7a4e30;
  --gold:#c4a573; --gold-deep:#a9853f; --gold-light:#dcc8a0;
  --cream:#f8f1e7; --cream-deep:#ede0ce; --cream-light:#fffdf9;
  --text-dark:#3a281a; --text-mid:#5a4233; --text-light:#9a8574;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
html,body{overflow-x:hidden;}
body{font-family:'Assistant',sans-serif;background:var(--cream);color:var(--text-dark);
  min-height:100vh;display:flex;flex-direction:column;line-height:1.8;font-size:1.4rem;}

.logo-banner{width:100%;background:var(--cream);}
.logo-banner img{width:100%;max-width:900px;height:auto;display:block;margin:0 auto;}
.author-line{text-align:center;padding:1.1rem 1rem .2rem;}
.author-line p{font-family:'Heebo',sans-serif;font-size:1.5rem;font-weight:600;color:var(--primary-dark);}
.author-line .star{color:var(--gold);font-size:1rem;margin-left:.35rem;}
.title-block{text-align:center;padding:.5rem 1.5rem .3rem;}
.main-title{font-family:'Suez One',serif;font-size:clamp(2.2rem,5vw,3.4rem);color:var(--primary);font-weight:normal;line-height:1.3;margin-bottom:.4rem;}
.subtitle{font-family:'Heebo',sans-serif;font-size:clamp(1.25rem,3vw,1.4rem);color:var(--primary);font-weight:600;}
.gold-divider{display:flex;align-items:center;justify-content:center;gap:1rem;padding:.6rem 2rem 1.5rem;}
.gold-divider::before,.gold-divider::after{content:'';height:1.5px;width:80px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.gold-divider span{color:var(--gold);font-size:1.1rem;letter-spacing:.3rem;}

.content{flex:1;max-width:760px;margin:0 auto;padding:0 1.5rem 3rem;width:100%;}

.steps-bar{display:flex;justify-content:center;gap:.5rem;margin-bottom:1.3rem;}
.dot{width:.65rem;height:.65rem;border-radius:50%;background:var(--gold-light);}
.dot.on{background:var(--primary);}

.card{background:var(--cream-light);border-radius:1.25rem;padding:2.5rem;margin-bottom:2rem;
  box-shadow:0 6px 28px rgba(100,65,30,.10);border-top:3px solid var(--primary);}
.card h2{font-family:'Suez One',serif;font-size:2rem;color:var(--primary);font-weight:normal;
  margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1.5px solid var(--cream-deep);line-height:1.35;}
.card p{font-family:'Varela Round',sans-serif;font-size:1.4rem;color:#2d2d2d;line-height:1.85;margin-bottom:1rem;}
.card p:last-child{margin-bottom:0;}
.privacy{font-family:'Assistant',sans-serif!important;font-size:1.1rem!important;color:var(--text-mid)!important;
  background:rgba(45,122,110,.06);border-radius:.75rem;padding:.7rem 1rem;}

.lead-line{font-family:'Suez One',serif!important;font-size:clamp(1.3rem,3.5vw,1.6rem)!important;color:var(--primary)!important;line-height:1.5!important;margin-bottom:1rem!important;}
.instruction-note{background:rgba(45,122,110,.06);border-radius:.75rem;padding:1rem 1.3rem;margin:0 0 1.2rem;border-right:3px solid var(--primary-light);}
.instruction-note p{font-size:1.25rem;line-height:1.7;margin:0;}

/* כפתורים */
.controls{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.6rem;}
.btn{font-family:'Heebo',sans-serif;font-weight:700;font-size:1.3rem;border:none;border-radius:99px;
  padding:.9rem 1.8rem;min-height:54px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;line-height:1.3;text-align:center;}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:var(--cream-light);box-shadow:0 4px 16px rgba(45,122,110,.25);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(45,122,110,.35);}
.btn-primary:disabled{background:var(--primary-light);color:var(--cream-light);opacity:.5;box-shadow:none;transform:none;cursor:default;}
.btn-soft{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:var(--cream-light);box-shadow:0 4px 16px rgba(45,122,110,.25);}
.btn-soft:hover{transform:translateY(-2px);}
.btn-cream{background:var(--cream-light);color:var(--primary-dark);box-shadow:0 4px 16px rgba(0,0,0,.12);}
.btn-cream:hover{transform:translateY(-2px);}

/* גלגל החיים, לפי האפליקציה משיעור 8 */
.domain-display{min-height:3.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;margin:0 auto .8rem;padding:.6rem 1rem;max-width:600px;border-radius:.9rem;background:rgba(45,122,110,.05);transition:background .25s ease;}
.domain-display.active{background:rgba(45,122,110,.10);}
.dd-name{font-family:'Suez One',serif;font-size:1.5rem;color:var(--primary-dark);line-height:1.2;}
.dd-sub{font-family:'Varela Round',sans-serif;font-size:1.15rem;color:var(--text-mid);margin-top:.25rem;}
.dd-hint{font-family:'Varela Round',sans-serif;font-size:1.1rem;color:var(--text-light);}
.wheel-stage{width:100%;max-width:560px;margin:0 auto;}
.wheel-stage svg{width:100%;height:auto;display:block;touch-action:manipulation;}
.ring-cell{cursor:pointer;}
.ring-cell:hover{filter:brightness(1.04);}
.wheel-stage.static .ring-cell{cursor:pointer;}

.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:1rem;}
.score-item{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--cream);border-radius:.7rem;padding:.55rem .9rem;}
.score-name{display:flex;align-items:center;gap:.55rem;font-family:'Heebo',sans-serif;font-weight:600;font-size:1.1rem;color:var(--text-dark);}
.score-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.score-val{font-family:'Suez One',serif;font-size:1.3rem;color:var(--primary-dark);min-width:1.6rem;text-align:center;}
.counter{font-family:'Heebo',sans-serif;font-size:1.1rem;color:var(--text-mid);text-align:center;margin-top:1rem;}

/* בחירת תחום */
.picture{background:rgba(45,122,110,.06);border-radius:1rem;padding:1rem 1.2rem;margin:1rem 0 1.2rem;}
.picture p{font-size:1.25rem;margin-bottom:.4rem;}
.picture p:last-child{margin-bottom:0;}
.picture b{font-family:'Heebo',sans-serif;color:var(--primary-dark);}
.chips{display:flex;flex-wrap:wrap;gap:.55rem;margin:.4rem 0 1.2rem;}
.chip{font-family:'Heebo',sans-serif;font-size:1.1rem;cursor:pointer;background:rgba(45,122,110,.06);color:var(--primary-dark);
  border:1.5px solid var(--primary-light);border-radius:999px;padding:.45rem 1.05rem;transition:all .15s;}
.chip .n{opacity:.7;font-size:.9rem;margin-right:.35rem;}
.chip.active{background:var(--primary);color:var(--cream-light);border-color:var(--primary);}
.field-label{display:block;font-family:'Heebo',sans-serif;font-weight:700;font-size:1.25rem;color:var(--primary-dark);margin:.4rem 0 .5rem;}
.example{font-family:'Varela Round',sans-serif;font-size:1.15rem;color:var(--text-mid);background:var(--cream);border-radius:.75rem;padding:.75rem 1rem;margin-bottom:.7rem;line-height:1.7;}
.example b{color:var(--primary-dark);font-family:'Heebo',sans-serif;}
textarea,input[type=text]{width:100%;font-family:'Varela Round',sans-serif;font-size:1.25rem;color:var(--text-dark);background:#fff;
  border:2px solid rgba(45,122,110,.3);border-radius:.9rem;padding:.8rem 1rem;line-height:1.7;outline:none;}
textarea{min-height:96px;resize:vertical;}
textarea:focus,input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,122,110,.12);}

/* המשפט ברקע */
.voice-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem;}
.voice{text-align:right;width:100%;background:var(--cream);border:2px solid rgba(196,165,115,.45);border-radius:.85rem;padding:.7rem 1rem;
  font-family:'Varela Round',sans-serif;font-size:1.2rem;color:var(--text-dark);cursor:pointer;line-height:1.5;transition:all .12s;}
.voice:hover{border-color:var(--primary);}
.voice.on{background:var(--primary);border-color:var(--primary-dark);color:var(--cream-light);}
.own-label{font-family:'Heebo',sans-serif;font-size:1.1rem;color:var(--text-mid);margin:.3rem 0 .4rem;display:block;}

/* הסרט שלי */
.film{background:var(--cream-light);border-radius:1.25rem;padding:1.8rem 1.6rem;margin-bottom:1.6rem;
  box-shadow:0 6px 28px rgba(100,65,30,.10);border-top:8px solid var(--primary);text-align:center;}
.film-lbl{font-family:'Heebo',sans-serif;font-size:1rem;font-weight:700;color:var(--text-light);letter-spacing:.06em;}
.film-dom{font-family:'Suez One',serif;font-size:1.8rem;color:var(--primary);margin:.3rem 0 .2rem;line-height:1.3;}
.film-score{font-family:'Heebo',sans-serif;font-size:1.05rem;color:var(--text-mid);}

.chain{display:flex;flex-direction:column;margin:.4rem 0 1rem;}
.link{display:flex;gap:.9rem;align-items:flex-start;background:var(--cream);border-radius:1rem;padding:1rem 1.1rem;border:1.5px solid var(--gold-light);}
.link.known{background:rgba(45,122,110,.07);border-color:rgba(45,122,110,.35);}
.link .num{flex-shrink:0;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--primary);color:var(--cream-light);
  font-family:'Heebo',sans-serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;margin-top:.15rem;}
.link.unknown .num{background:var(--cream-light);color:var(--primary);border:1.5px dashed var(--primary-light);}
.link .lt{font-family:'Heebo',sans-serif;font-weight:700;font-size:1.15rem;color:var(--primary-dark);line-height:1.4;}
.link .lv{font-family:'Varela Round',sans-serif;font-size:1.2rem;color:#2d2d2d;line-height:1.6;margin-top:.15rem;}
.link.unknown .lv{color:var(--text-light);}
.arrow{text-align:center;color:var(--gold);font-size:1.1rem;line-height:1;padding:.35rem 0;}
.chain-cap{font-family:'Varela Round',sans-serif;font-size:1.25rem;color:var(--primary-dark)!important;text-align:center;line-height:1.75;margin-top:.4rem;}

.reflect{border-right:4px solid var(--gold);background:rgba(196,165,115,.09);padding:1.1rem 1.4rem;border-radius:0 1rem 1rem 0;margin:1.2rem 0 0;}
.reflect .rh{font-family:'Heebo',sans-serif;font-weight:700;font-size:1.1rem;color:var(--primary-dark);margin-bottom:.3rem;}
.reflect .rt{font-family:'Varela Round',sans-serif;font-size:1.25rem;color:#2d2d2d;line-height:1.8;}

.prompt-box{background:var(--cream);border:1.5px solid var(--gold-light);border-radius:.9rem;padding:1.1rem 1.2rem;
  font-family:'Varela Round',sans-serif;font-size:1.1rem;color:var(--text-mid);line-height:1.7;white-space:pre-wrap;max-height:260px;overflow:auto;}
.copy-status{font-family:'Heebo',sans-serif;font-size:1.1rem;color:var(--primary);text-align:center;margin-top:.7rem;min-height:1.5rem;}

.invite{background:linear-gradient(160deg,var(--primary-dark),var(--primary));border-radius:1.25rem;padding:2rem 1.8rem;margin-bottom:2rem;text-align:center;}
.invite h2{font-family:'Suez One',serif;font-weight:normal;font-size:1.8rem;color:var(--cream-light);margin-bottom:.8rem;line-height:1.35;}
.invite p{text-align:right;font-family:'Varela Round',sans-serif;font-size:1.3rem;color:var(--cream-light);line-height:1.8;margin-bottom:.4rem;}
.invite .controls{margin-top:1.3rem;}
.sig-div{display:flex;align-items:center;gap:.7rem;margin:1.2rem 0 .5rem;}
.sig-div i{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold-light) 12%,var(--gold-light) 88%,transparent);}
.sig-div svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--gold-light);stroke-width:1.7;}
.invite p.sig{text-align:center;font-family:'Heebo',sans-serif;font-weight:600;font-size:1.25rem;color:var(--gold-light);margin:0;}
.wa-ic{width:1.35rem;height:1.35rem;flex-shrink:0;}

.footer{background:linear-gradient(160deg,var(--primary-dark),var(--primary));padding:2.2rem 1.5rem;text-align:center;margin-top:1.5rem;}
.footer p{font-family:'Heebo',sans-serif;font-size:1.05rem;color:var(--cream-light);font-weight:600;}

@media(max-width:640px){
  body{font-size:1.25rem;}
  .main-title{font-size:2rem;}
  .content{padding:0 1rem 2rem;}
  .card{padding:1.5rem 1.1rem;}
  .card h2{font-size:1.6rem;}
  .card p{font-size:1.25rem;}
  .btn{width:100%;font-size:1.15rem;}
  .score-grid{gap:.45rem;}
  .score-item{padding:.45rem .65rem;}
  .score-name{font-size:1rem;gap:.4rem;}
  .score-val{font-size:1.15rem;}
  .film{padding:1.4rem 1.1rem;}
  .film-dom{font-size:1.55rem;}
  .invite{padding:1.6rem 1.2rem;}
  .invite h2{font-size:1.5rem;}
  .invite p{font-size:1.2rem;}
}
</style>
</head>

function arcPath(rIn,rOut,a0,a1){
  var p0=polar(rOut,a0), p1=polar(rOut,a1), p2=polar(rIn,a1), p3=polar(rIn,a0), large=(a1-a0)>Math.PI?1:0;
  return "M "+p0.x+" "+p0.y+" A "+rOut+" "+rOut+" 0 "+large+" 1 "+p1.x+" "+p1.y+" L "+p2.x+" "+p2.y+" A "+rIn+" "+rIn+" 0 "+large+" 0 "+p3.x+" "+p3.y+" Z";
}
function lighten(hex,amt){ hex=hex.replace('#','');
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return "rgb("+Math.round(r+(255-r)*amt)+","+Math.round(g+(255-g)*amt)+","+Math.round(b+(255-b)*amt)+")"; }
function el(tag,attrs){ var e=document.createElementNS(SVG_NS,tag); for (var k in attrs) e.setAttribute(k,attrs[k]); return e; }

/* opts: { onCell(i,lvl), onBadge(i), highlight } */
function buildWheel(svg, opts){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  var ringW=(R_OUTER-R_INNER)/RINGS, seg=(Math.PI*2)/N;
  var defs=el('defs',{}), grad=el('radialGradient',{id:'hubGrad'});
  grad.appendChild(el('stop',{offset:'0%','stop-color':'#4a9e90'}));
  grad.appendChild(el('stop',{offset:'100%','stop-color':'#1f5f55'}));
  defs.appendChild(grad); svg.appendChild(defs);
  for (var k=1;k<=RINGS;k++){
    var strong=(k%5===0);
    svg.appendChild(el('circle',{cx:CX,cy:CY,r:R_INNER+ringW*k,fill:'none',
      stroke: strong?'rgba(122,78,48,0.45)':'rgba(154,133,116,0.32)','stroke-width': strong?'1.6':'1'}));
  }
  DOMAINS.forEach(function(d,i){
    var a0=-Math.PI/2+i*seg+GAP/2, a1=-Math.PI/2+(i+1)*seg-GAP/2, g=el('g',{});
    for (var k=0;k<RINGS;k++){
      var cell=el('path',{d:arcPath(R_INNER+ringW*k,R_INNER+ringW*(k+1),a0,a1),'class':'ring-cell',
        'data-domain':i,'data-level':k+1,stroke:'#fffdf9','stroke-width':'1.4'});
      g.appendChild(cell);
    }
    g.appendChild(el('path',{d:arcPath(R_OUTER+4,R_OUTER+12,a0,a1),fill:d.color,opacity:'0.92'}));
    svg.appendChild(g);
  });
  for (var i=0;i<N;i++){
    var aDiv=-Math.PI/2+i*seg, pIn=polar(R_INNER,aDiv), pOut=polar(R_OUTER,aDiv);
    var line=el('line',{x1:pIn.x,y1:pIn.y,x2:pOut.x,y2:pOut.y,stroke:'rgba(92,58,30,0.30)','stroke-width':'1.4'});
    line.style.pointerEvents='none'; svg.appendChild(line);
  }
  if (opts.highlight>=0){
    var h=opts.highlight, h0=-Math.PI/2+h*seg+GAP/2, h1=-Math.PI/2+(h+1)*seg-GAP/2;
    var hl=el('path',{d:arcPath(R_INNER,R_OUTER+12,h0,h1),fill:'none',stroke:'#a9853f','stroke-width':'3.5','stroke-dasharray':'7 5'});
    hl.style.pointerEvents='none'; svg.appendChild(hl);
  }
  DOMAINS.forEach(function(d,i){
    var a0=-Math.PI/2+i*seg+GAP/2, a1=-Math.PI/2+(i+1)*seg-GAP/2, bp=polar(R_OUTER+34,(a0+a1)/2);
    var bg=el('g',{'class':'badge-group','data-domain':i}); bg.style.cursor='pointer';
    var big=(opts.highlight===i);
    bg.appendChild(el('circle',{cx:bp.x,cy:bp.y,r:big?'24':'21',fill:d.color,stroke:big?'#a9853f':'#fffdf9','stroke-width':big?'3.5':'2.5'}));
    var ip=el('path',{d:ICONS[d.icon],transform:'translate('+(bp.x-12)+','+(bp.y-12)+')',fill:'none',stroke:'#fffdf9',
      'stroke-width':'1.7','stroke-linecap':'round','stroke-linejoin':'round'});
    ip.style.pointerEvents='none'; bg.appendChild(ip); svg.appendChild(bg);
  });
  svg.appendChild(el('circle',{cx:CX,cy:CY,r:R_INNER-4,fill:'url(#hubGrad)',stroke:'#fffdf9','stroke-width':'3'}));
  var heart=el('path',{d:ICONS.heart,transform:'translate('+(CX-12)+','+(CY-12)+')',fill:'none',stroke:'#fffdf9',
    'stroke-width':'1.8','stroke-linecap':'round','stroke-linejoin':'round'});
  heart.style.pointerEvents='none'; svg.appendChild(heart);
  paintWheel(svg);
  svg.querySelectorAll('.ring-cell').forEach(function(c){
    c.addEventListener('click',function(){ if(opts.onCell) opts.onCell(+c.getAttribute('data-domain'), +c.getAttribute('data-level')); });
  });
  svg.querySelectorAll('.badge-group').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation(); if(opts.onBadge) opts.onBadge(+b.getAttribute('data-domain')); });
  });
}
function paintWheel(svg){
  svg.querySelectorAll('.ring-cell').forEach(function(c){
    var i=+c.getAttribute('data-domain'), lvl=+c.getAttribute('data-level');
    c.setAttribute('fill', lvl<=scores[i] ? lighten(DOMAINS[i].color, Math.max(0.04, 0.55-(lvl/RINGS)*0.5)) : '#fbf6ee');
  });
}

function steps(){
  var order=["intro","rate","focus","voice","film"], idx=order.indexOf(state), h="";
  for (var i=0;i<order.length;i++) h+='<div class="dot'+(i<=idx?' on':'')+'"></div>';
  document.getElementById('steps-bar').innerHTML=h;
}
function render(){
  steps();
  var p=document.getElementById('panel');
  if(state==="intro") rIntro(p);
  else if(state==="rate") rRate(p);
  else if(state==="focus") rFocus(p);
  else if(state==="voice") rVoice(p);
  else rFilm(p);
}
function go(s){ state=s; render(); window.scrollTo({top:document.getElementById('steps-bar').offsetTop-20, behavior:'smooth'}); }

function rIntro(p){
  p.innerHTML='<div class="card"><h2>אותו ריב, אותה תחושה בעבודה, אותה סצנה חוזרת שוב ושוב?</h2>'+
    '<p>כשסצנה חוזרת שוב ושוב, זו אינה תקלה. זהו מסר שמבקש להתגלות.</p>'+
    '<p>בפעילות זו תזהו סצנה אחת שחוזרת בחיים שלכם, ותתחילו לגלות את הקוד שמנהל אותה.</p>'+
    '<div class="controls"><button class="btn btn-primary" id="go1" type="button">להתחיל ←</button></div></div>';
  document.getElementById('go1').onclick=function(){ go("rate"); };
}

function showDomain(i){
  var dd=document.getElementById('domainDisplay'); if(!dd) return;
  var d=DOMAINS[i]; dd.classList.add('active');
  dd.innerHTML='<span class="dd-name" style="color:'+d.colorText+'">'+d.name+'</span><span class="dd-sub">'+d.sub+'</span>';
}
function scoreGridHTML(){
  return DOMAINS.map(function(d,i){
    return '<div class="score-item"><span class="score-name"><span class="score-dot" style="background:'+d.color+'"></span>'+d.name+'</span>'+
      '<span class="score-val">'+(scores[i]||'–')+'</span></div>';
  }).join("");
}

function rRate(p){
  p.innerHTML='<div class="card"><h2>איך החיים נראים עכשיו?</h2>'+
    '<p class="lead-line">סמנו בכל ענף את מידת שביעות הרצון וההשקעה שלכם בו עכשיו, מאחד עד עשר.</p>'+
    '<div class="instruction-note"><p>לחיצה על ענף צובעת אותו עד הרמה שבחרתם ומציגה את שמו ותיאורו מעל הגלגל. לחיצה חוזרת על אותה רמה מורידה דרגה.</p></div>'+
    '<div class="domain-display" id="domainDisplay"><span class="dd-hint">לחצו על ענף בגלגל כדי לראות מהו ולסמן את הרמה</span></div>'+
    '<div class="wheel-stage"><svg id="wheel" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="גלגל החיים"></svg></div>'+
    '<div class="score-grid" id="scoreGrid">'+scoreGridHTML()+'</div>'+
    '<p class="counter" id="counter"></p>'+
    '<div class="controls"><button class="btn btn-soft" id="b1" type="button">חזרה</button>'+
    '<button class="btn btn-primary" id="n1" type="button" disabled>להמשיך ←</button></div></div>';
  var svg=document.getElementById('wheel');
  function refresh(){
    document.getElementById('scoreGrid').innerHTML=scoreGridHTML();
    var c=ratedCount();
    document.getElementById('counter').textContent = c<N ? 'סימנתם '+c+' מתוך '+N+' ענפים' : 'הגלגל שלכם מוכן';
    document.getElementById('n1').disabled=!allRated();
  }
  buildWheel(svg,{ highlight:-1,
    onCell:function(i,lvl){ scores[i]=(scores[i]===lvl)?lvl-1:lvl; paintWheel(svg); refresh(); showDomain(i); },
    onBadge:function(i){ showDomain(i); } });
  refresh();
  document.getElementById('b1').onclick=function(){ go("intro"); };
  document.getElementById('n1').onclick=function(){ if(allRated()){ if(focusIdx<0) focusIdx=lowestIdx(); go("focus"); } };
}

function rFocus(p){
  var lo=lowestIdx(), hi=-1;
  for (var j=0;j<N;j++){ if(hi<0 || scores[j]>scores[hi]) hi=j; }
  var flowLine = scores[hi]>scores[lo] ? '<p>הענף שדורג הכי גבוה: <b>'+DOMAINS[hi].name+'</b> ('+scores[hi]+').</p>' : '';
  var chips=DOMAINS.map(function(d,i){
    return '<button type="button" class="chip'+(focusIdx===i?' active':'')+'" data-i="'+i+'">'+d.name+'<span class="n">'+scores[i]+'</span></button>';
  }).join("");
  p.innerHTML='<div class="card"><h2>איזה ענף מבקש תשומת לב?</h2>'+
    '<div class="wheel-stage"><svg id="wheel2" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="גלגל החיים שלי"></svg></div>'+
    '<div class="picture">'+flowLine+'<p>הענף שדורג הכי נמוך: <b>'+DOMAINS[lo].name+'</b> ('+scores[lo]+').</p></div>'+
    '<p>סימנו בשבילכם את הענף הזה. אם ענף אחר מבקש עכשיו יותר תשומת לב, בחרו בו.</p>'+
    '<div class="chips">'+chips+'</div>'+
    '<label class="field-label" for="scene">מה חוזר אצלכם בענף הזה שוב ושוב? כתבו במשפט אחד.</label>'+
    '<div class="example">לדוגמה, ב<b>'+DOMAINS[focusIdx].name+'</b>: '+DOMAINS[focusIdx].ex+'</div>'+
    '<textarea id="scene" placeholder="כתבו כאן...">'+esc(scene)+'</textarea>'+
    '<div class="controls"><button class="btn btn-soft" id="b2" type="button">חזרה</button>'+
    '<button class="btn btn-primary" id="n2" type="button"'+(scene.trim()?'':' disabled')+'>להמשיך ←</button></div></div>';
  function pick(i){ focusIdx=i; var y=window.scrollY; rFocus(p); window.scrollTo(0,y); }
  buildWheel(document.getElementById('wheel2'),{ highlight:focusIdx, onCell:function(i){ pick(i); }, onBadge:pick });
  p.querySelectorAll('.chip').forEach(function(c){ c.onclick=function(){ pick(+c.getAttribute('data-i')); }; });
  var ta=document.getElementById('scene'), n2=document.getElementById('n2');
  ta.oninput=function(){ scene=ta.value; n2.disabled=!scene.trim(); };
  document.getElementById('b2').onclick=function(){ go("rate"); };
  n2.onclick=function(){ if(scene.trim()) go("voice"); };
}

function rVoice(p){
  var ready = ownVoice.trim();
  p.innerHTML='<div class="card"><h2>מה אתם אומרים לעצמכם?</h2>'+
    '<p>כתבתם על '+DOMAINS[focusIdx].name+':</p>'+
    '<div class="example" style="font-size:1.25rem;color:var(--text-dark)">"'+esc(scene.trim())+'"</div>'+
    '<label class="field-label" for="own">כשזה קורה, מה אתם אומרים לעצמכם? כתבו את המשפט כפי שהוא עולה בראש.</label>'+
    '<div class="example">לדוגמה: '+SAY[focusIdx]+'</div>'+
    '<textarea id="own" placeholder="כתבו כאן...">'+esc(ownVoice)+'</textarea>'+
    '<div class="controls"><button class="btn btn-soft" id="b3" type="button">חזרה</button>'+
    '<button class="btn btn-primary" id="n3" type="button"'+(ready?'':' disabled')+'>לראות את הסרט שלי ←</button></div></div>';
  var own=document.getElementById('own'), n3=document.getElementById('n3');
  own.oninput=function(){ ownVoice=own.value; n3.disabled=!ownVoice.trim(); };
  document.getElementById('b3').onclick=function(){ go("focus"); };
  n3.onclick=function(){ if(ownVoice.trim()) go("film"); };
}

function buildPrompt(){
  var d=DOMAINS[focusIdx];
  return "אני מתבונן/ת בענף "+d.name+" בחיים שלי. בגלגל החיים סימנתי לו "+scores[focusIdx]+" מתוך 10.\n"+
    "מה שחוזר בו שוב ושוב: "+scene.trim()+"\n"+
    "כשזה קורה, אני אומר/ת לעצמי: \""+ownVoice.trim().replace(/[.]$/,"")+"\".\n\n"+
    "אני רוצה למצוא את האמונה שמתחת למשפט הזה. אני עובד/ת עם הרעיון שאמונה שנוצרה מוקדם בחיים מפרשת את מה שקורה, מעוררת רגש ותגובה, ומכאן הסצנה חוזרת.\n\n"+
    "בוא נעשה שיחה. שאל אותי שאלה אחת בכל פעם, חכה לתשובה שלי, ורק אז המשך.\n"+
    "עזור לי לזהות את האמונה, לראות איך היא משפיעה על מה שאני עושה בענף הזה, ומאיפה היא מוכרת לי.\n"+
    "שמור על טון סקרן ומכיל, ותן לי להגיע לתובנות בעצמי.\n"+
    "בסוף השיחה, עזור לי לנסח אמונה חדשה לענף הזה, שאני יכול/ה להתחיל להאמין בה כבר עכשיו.";
}

function rFilm(p){
  var d=DOMAINS[focusIdx];
  p.innerHTML=
    '<div class="film"><div class="film-lbl">הסרט שלי</div><div class="film-dom" style="color:'+d.colorText+'">'+d.name+'</div>'+
    '<div class="film-score">בגלגל החיים: '+scores[focusIdx]+' מתוך 10</div></div>'+

    '<div class="card"><h2>מה הסרט החיצוני מגלה לי?</h2>'+
    '<div class="chain">'+
    '<div class="link known"><div><div class="lt">מה חוזר אצלי</div><div class="lv">'+esc(scene.trim())+'</div></div></div>'+
    '<div style="height:.7rem"></div>'+
    '<div class="link known"><div><div class="lt">מה אני אומר/ת לעצמי</div><div class="lv">"'+esc(ownVoice.trim())+'"</div></div></div>'+
    '</div>'+
    '<p>מתחת למשפט הזה פועלת אמונה. מודל השפה ישאל אתכם שאלה אחת בכל פעם, ויעזור לכם למצוא אותה.</p>'+
    '<p>העתיקו את ההנחיה, פתחו שיחה חדשה ב-ChatGPT, ב-Claude או ב-Gemini, והדביקו.</p>'+
    '<div class="prompt-box" id="prompt-box">'+esc(buildPrompt())+'</div>'+
    '<div class="controls"><button class="btn btn-primary" id="cp" type="button">העתקת ההנחיה</button></div>'+
    '<div class="copy-status" id="copy-status"></div></div>'+

    '<div class="invite">'+
    '<p>בשיטת <span style="white-space:nowrap">בינת הלב - Life Coding</span> עוברים מתגובה אוטומטית לבחירה מודעת: מזהים את האמונה, חוקרים אותה, וכותבים את הקוד מחדש.</p>'+
    '<div class="sig-div" aria-hidden="true"><i></i><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><i></i></div>'+
    '<p class="sig">באהבה, יעל נזר</p>'+
    '<div class="controls"><a class="btn btn-cream" href="'+waLink()+'" target="_blank" rel="noopener">'+WA_SVG+'בואו נדבר</a></div></div>'+

    '<div class="controls" style="margin-top:0"><button class="btn btn-soft" id="b4" type="button">חזרה</button>'+
    '<button class="btn btn-soft" id="rs" type="button">להתחיל מחדש</button>'+
    '<a class="btn btn-primary" href="./">למידע נוסף</a></div>';

  document.getElementById('cp').onclick=copyPrompt;
  document.getElementById('b4').onclick=function(){ go("voice"); };
  document.getElementById('rs').onclick=function(){
    for (var i=0;i<N;i++) scores[i]=0; focusIdx=-1; scene=""; ownVoice=""; go("intro");
  };
}


function copyPrompt(){
  var text=buildPrompt(), st=document.getElementById('copy-status');
  function ok(){ st.textContent='ההנחיה הועתקה. אפשר להדביק אותה בשיחה חדשה עם מודל שפה.'; }
  function manual(){ st.textContent='סמנו את הטקסט בתיבה והעתיקו אותו ידנית.'; }
  function fallback(){
    var done=false;
    try{ var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.top='0'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
      done=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){ done=false; }
    if(done) ok(); else manual();
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok,fallback); }
  else fallback();
}

render();
</script>
